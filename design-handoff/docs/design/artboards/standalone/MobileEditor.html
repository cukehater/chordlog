<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>모바일 곡 작성</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@300;400;500;700&amp;family=Hahmlet:wght@500;600;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;font-family:'Gothic A1',system-ui,sans-serif;background:#0C0D10;color:#F4F4F5;-webkit-font-smoothing:antialiased}
a{color:#FF9D4D}a:hover{color:#FFBC86}
button,input,select,textarea{font-family:inherit}
::selection{background:rgba(255,157,77,0.28)}
</style>
</head>
<body>
<div style="width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column;background:#0C0D10;overflow:hidden">

<header style="flex-shrink:0;box-sizing:border-box;padding:52px 12px 10px;display:flex;align-items:center;gap:8px">
<a href="MobileList.dc.html" style="height:44px;display:flex;align-items:center;padding:0 8px;font-size:14px;color:#8A909C;text-decoration:none">취소</a>
<span style="flex-grow:1;text-align:center;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;letter-spacing:0.14em;color:#6E7480">NEW SONG</span>
<button type="button" style="height:36px;padding:0 16px;border:0;border-radius:9px;background:#FF9D4D;color:#1A1206;font-size:13.5px;font-weight:700;cursor:pointer">저장</button>
</header>

<div style="flex-shrink:0;box-sizing:border-box;padding:4px 20px 14px;display:flex;flex-direction:column;gap:14px;border-bottom:1px solid #16181D">

<div style="display:flex;align-items:center;background:#141519;border:1px solid #24262E;border-radius:11px;padding:3px">
<button type="button" style="flex-grow:1;height:38px;border:0;border-radius:8px;background:#FF9D4D;color:#1A1206;font-size:13.5px;font-weight:700;cursor:pointer">작성</button>
<button type="button" style="flex-grow:1;height:38px;border:0;border-radius:8px;background:transparent;color:#8A909C;font-size:13.5px;font-weight:500;cursor:pointer">미리보기</button>
</div>

<div style="display:flex;flex-direction:column;gap:6px">
<label for="mtitle" style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:9.5px;letter-spacing:0.16em;color:#565C68">TITLE *</label>
<input id="mtitle" type="text" value="새벽 두 시의 골목" style="height:36px;box-sizing:border-box;padding:0;border:0;border-bottom:1px solid #2A2D36;background:transparent;font-family:'Hahmlet',serif;font-size:19px;font-weight:600;color:#F4F4F5;outline:none">
</div>

<div style="display:flex;gap:14px">
<div style="flex-grow:1;display:flex;flex-direction:column;gap:6px">
<label for="martist" style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:9.5px;letter-spacing:0.16em;color:#565C68">ARTIST</label>
<input id="martist" type="text" value="무렵" style="height:36px;box-sizing:border-box;padding:0;border:0;border-bottom:1px solid #2A2D36;background:transparent;font-size:15px;color:#F4F4F5;outline:none">
</div>
<div style="width:70px;display:flex;flex-direction:column;gap:6px">
<label for="mkey" style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:9.5px;letter-spacing:0.16em;color:#565C68">KEY</label>
<select id="mkey" style="height:36px;box-sizing:border-box;padding:0;border:0;border-bottom:1px solid #2A2D36;background:transparent;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:15px;font-weight:500;color:#F4F4F5;outline:none">
<option selected>G</option><option>C</option><option>D</option><option>Am</option><option>Em</option>
</select>
</div>
<div style="width:96px;display:flex;flex-direction:column;gap:6px">
<label for="mtuning" style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:9.5px;letter-spacing:0.16em;color:#565C68">TUNING</label>
<select id="mtuning" style="height:36px;box-sizing:border-box;padding:0;border:0;border-bottom:1px solid #2A2D36;background:transparent;font-size:14px;color:#F4F4F5;outline:none">
<option selected>표준</option><option>Drop D</option><option>반음 내림</option><option>오픈 G</option>
</select>
</div>
</div>

<div style="display:flex;align-items:center;gap:12px;background:#141519;border:1px solid #24262E;border-radius:12px;padding:11px 13px">
<div style="display:flex;flex-direction:column;gap:7px">
<label for="mcapo" style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:9.5px;letter-spacing:0.16em;color:#565C68">CAPO</label>
<select id="mcapo" style="height:36px;box-sizing:border-box;padding:0 8px;border:1px solid #2A2D36;border-radius:8px;background:#0C0D10;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:14px;font-weight:700;color:#F4F4F5;outline:none">
<option>0프렛</option><option>1프렛</option><option selected>2프렛</option><option>3프렛</option><option>4프렛</option><option>5프렛</option>
</select>
</div>
<div style="display:flex;flex-direction:column;gap:7px;flex-grow:1">
<svg width="160" height="30" viewBox="0 0 160 30" fill="none" aria-hidden="true">
<rect x="3" y="4" width="3.2" height="22" rx="1.6" fill="#5A606C"></rect>
<path d="M37 4v22M71 4v22M105 4v22M139 4v22" stroke="#2A2D36" stroke-width="1.2"></path>
<path d="M6 7h151M6 11.5h151M6 16h151M6 20.5h151M6 25h151" stroke="#2F333C" stroke-width="0.9"></path>
<rect x="58" y="1" width="7" height="28" rx="3.5" fill="#FF9D4D"></rect>
</svg>
<span style="font-size:11px;line-height:1.5;color:#6E7480">코드는 그대로. 끼우는 위치만 기록돼요.</span>
</div>
</div>

</div>

<section style="flex-grow:1;box-sizing:border-box;background:#0A0B0E;display:flex;flex-direction:column;overflow:hidden">
<div style="flex-shrink:0;display:flex;align-items:center;gap:6px;padding:10px 16px 8px;overflow:hidden">
<span style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:9px;letter-spacing:0.14em;color:#3A3E47;flex-shrink:0">INSERT</span>
<button type="button" style="flex-shrink:0;height:30px;padding:0 9px;border:1px solid #24262E;border-radius:7px;background:transparent;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;color:#C9CDD5;cursor:pointer">[코드]</button>
<button type="button" style="flex-shrink:0;height:30px;padding:0 9px;border:1px solid #24262E;border-radius:7px;background:transparent;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;color:#C9CDD5;cursor:pointer">섹션</button>
<button type="button" style="flex-shrink:0;height:30px;padding:0 9px;border:1px solid rgba(255,157,77,0.4);border-radius:7px;background:rgba(255,157,77,0.1);font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;color:#FF9D4D;cursor:pointer">스트러밍</button>
<button type="button" style="flex-shrink:0;height:30px;padding:0 9px;border:1px solid rgba(255,157,77,0.4);border-radius:7px;background:rgba(255,157,77,0.1);font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;color:#FF9D4D;cursor:pointer">TAB</button>
</div>
<div style="flex-grow:1;display:flex;overflow:hidden">
<div aria-hidden="true" style="flex-shrink:0;width:36px;box-sizing:border-box;padding:8px 10px 8px 0;text-align:right;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;line-height:22px;color:#3A3E47;display:flex;flex-direction:column">
<span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>10</span><span>11</span><span>12</span><span>13</span><span>14</span><span>15</span><span>16</span><span>17</span>
</div>
<label for="msrc" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">악보 원문</label>
<textarea id="msrc" spellcheck="false" style="flex-grow:1;box-sizing:border-box;border:0;resize:none;padding:8px 14px 8px 0;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;line-height:22px;color:#C9CDD5;background:transparent;outline:none">{key: G}
{capo: 2}
{tuning: E A D G B E}

{sos: Intro, Verse 1}
D - D - D U D - D - D - D U - -
&gt;               &gt;
{eos}

{sot: 메인 리프  x3}
E|-------------10------------|
B|--13-11----11----11----11--|
G|-------10----------10------|
D|---------------------------|
A|---------------------------|
E|---------------------------|
{eot}</textarea>
</div>
<div style="flex-shrink:0;display:flex;align-items:center;gap:10px;padding:11px 20px 26px;border-top:1px solid #16181D;background:rgba(255,157,77,0.07)">
<span style="flex-shrink:0;width:17px;height:17px;border-radius:5px;background:#FF9D4D;color:#1A1206;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center">i</span>
<span style="font-size:11.5px;line-height:1.5;color:#C9A183">TAB은 6줄이 한 덩어리 — 줄 수가 모자라면 저장할 때 알려드려요.</span>
</div>
</section>

</div>
</body>
</html>
