<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>관리자 로그인</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@300;400;500;700&amp;family=Hahmlet:wght@500;600;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;font-family:'Gothic A1',system-ui,sans-serif;background:#0C0D10;color:#F4F4F5;-webkit-font-smoothing:antialiased}
a{color:#FF9D4D}a:hover{color:#FFBC86}
button,input{font-family:inherit}
::selection{background:rgba(255,157,77,0.28)}
</style>
</head>
<body>
<div style="width:1440px;height:760px;box-sizing:border-box;position:relative;display:flex;flex-direction:column;background:#0C0D10;overflow:hidden">

<div aria-hidden="true" style="position:absolute;inset:0;background:radial-gradient(680px 340px at 50% 22%, rgba(255,157,77,0.11), rgba(255,157,77,0) 72%)"></div>

<header style="position:relative;flex-shrink:0;height:60px;box-sizing:border-box;padding:0 48px;display:flex;align-items:center">
<a href="Main.dc.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:#F4F4F5">
<span style="width:16px;height:16px;border-radius:4px;background:#FF9D4D;display:block"></span>
<span style="font-family:'Hahmlet',serif;font-size:17px;font-weight:700;letter-spacing:-0.01em">코드집</span>
</a>
</header>

<main style="position:relative;flex-grow:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;padding-bottom:70px">

<div style="display:flex;flex-direction:column;align-items:center;gap:14px">
<span style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;letter-spacing:0.22em;color:#FF9D4D">ADMIN ACCESS</span>
<h1 style="margin:0;font-family:'Hahmlet',serif;font-size:52px;font-weight:700;letter-spacing:-0.035em;line-height:1">한 사람을 위한 서랍</h1>
<p style="margin:0;font-size:14.5px;color:#8A909C">읽는 건 누구나. 쓰고 고치고 지우는 건 나만.</p>
</div>

<form style="width:380px;display:flex;flex-direction:column;gap:26px">
<div style="display:flex;flex-direction:column;gap:9px">
<label for="pw" style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10px;letter-spacing:0.16em;color:#565C68">PASSWORD</label>
<input id="pw" type="password" value="••••••••••" style="height:44px;box-sizing:border-box;padding:0;border:0;border-bottom:1px solid #2A2D36;background:transparent;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:20px;letter-spacing:0.14em;color:#F4F4F5;outline:none">
</div>
<div style="display:flex;align-items:center;gap:10px">
<input id="keep" type="checkbox" checked style="width:16px;height:16px;accent-color:#FF9D4D">
<label for="keep" style="font-size:13px;color:#8A909C">30일 동안 로그인 유지</label>
</div>
<button type="button" style="height:48px;border:0;border-radius:10px;background:#FF9D4D;color:#1A1206;font-size:15px;font-weight:700;cursor:pointer">로그인</button>
<div style="display:flex;align-items:center;justify-content:space-between;padding-top:6px;border-top:1px solid #1A1C22">
<a href="Main.dc.html" style="font-size:13px;text-decoration:none;padding-top:16px">← 곡 목록으로</a>
<span style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;color:#4A4F5A;padding-top:16px">SINGLE ACCOUNT</span>
</div>
</form>

</main>
</div>
</body>
</html>
